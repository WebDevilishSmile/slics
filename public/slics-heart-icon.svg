<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- The SLICs icon with a heart in place of the S, drawn the way the master
       (public/slics-icon.svg) draws its S, in tangent arcs: from the cleft at
       (50, 30), an r12.5 lobe that leaves it at 38° from upright, a gentle
       r78.58 side that meets the tip at (50, 71) at 50°, and the same again up
       the other side, back to the cleft. Its middle is the S's. No dot: in the
       animation (components/utility/AnimatedSlicsMark.jsx, the heart story) the
       dot waits inside the line where it closes. Same tile, gradient, sheen
       and stroke as the master, inside the same 80% safe circle. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="0.55" stop-color="#0884cc"/>
      <stop offset="1" stop-color="#01579b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#brand)"/>
  <rect width="100" height="100" fill="url(#sheen)"/>
  <path d="M50 30A12.5 12.5 0 0 0 28.73 42.78A78.58 78.58 0 0 0 50 71A78.58 78.58 0 0 0 71.27 42.78A12.5 12.5 0 0 0 50 30" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
