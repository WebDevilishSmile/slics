<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- The SLICs icon master ("Waypoint": the S is a route whose tail lands on
       a destination dot). Full-bleed: the blue fills the whole square and the
       glyph stays inside the 80% maskable safe circle, so the same art serves
       iOS, Android and maskable icons. `npm run icons:generate` renders every
       PNG/ICO from this file. The glyph alone is components/utility/SlicsMark.jsx;
       change both together. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="0.55" stop-color="#0884cc"/>
      <stop offset="1" stop-color="#01579b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#brand)"/>
  <rect width="100" height="100" fill="url(#sheen)"/>
  <path d="M60.09 25.92A12.8 12.8 0 1 0 50 46.6A14 14 0 1 1 49.51 74.59" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round"/>
  <circle cx="37.64" cy="67.17" r="6.4" fill="#fff"/>
</svg>
