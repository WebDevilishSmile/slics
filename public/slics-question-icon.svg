<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="512" height="512">
  <!-- The SLICs icon with a question mark in place of the S, drawn the way the
       master (public/slics-icon.svg) draws its S: two tangent arcs, then the
       destination dot. The hook is an r13 arc around (50, 34.75) that hands off
       at 60° to a reverse r13 arc around (63, 57.27), which ends heading
       straight down at x = 50. Same tile, gradient, sheen, stroke and dot as
       the master, inside the same 80% safe circle. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#29b6f6"/>
      <stop offset="0.55" stop-color="#0884cc"/>
      <stop offset="1" stop-color="#01579b"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.22" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="100" height="100" fill="url(#brand)"/>
  <rect width="100" height="100" fill="url(#sheen)"/>
  <path d="M38.74 28.25A13 13 0 1 1 56.5 46.01A13 13 0 0 0 50 57.27" fill="none" stroke="#fff" stroke-width="9.5" stroke-linecap="round"/>
  <circle cx="50" cy="73.6" r="6.4" fill="#fff"/>
</svg>
